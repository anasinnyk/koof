apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: monitors.sentry.kube.nas1k.dev
spec:
  group: sentry.kube.nas1k.dev
  names:
    kind: Monitor
    plural: monitors
    singular: monitor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.annotations.sentry\.kube\.nas1k\.dev/external-name
      name: External-Name
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MonitorSpec via `CustomResource`
        properties:
          spec:
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  `Orphan` keeps the external resource when the managed resource is deleted.
                  Without `Delete` in `managementPolicies` the resource is always orphaned.
                enum:
                - Delete
                - Orphan
                type: string
              forProvider:
                description: |-
                  `spec.forProvider`: the generated API fields plus references and
                  credentials.
                properties:
                  alert_rule:
                    description: Alert rule configuration created alongside the monitor.
                    nullable: true
                    properties:
                      environment:
                        description: Name of the environment
                        nullable: true
                        type: string
                      targets:
                        description: Array of dictionaries with information of the user or team to be notified
                        items:
                          description: '`MonitorForProviderAlertRuleTargetsItem`'
                          properties:
                            target_identifier:
                              description: ID of target object
                              format: int64
                              type: integer
                            target_type:
                              description: One of [Member, Team]
                              type: string
                          required:
                          - target_identifier
                          - target_type
                          type: object
                        type: array
                    required:
                    - targets
                    type: object
                  config:
                    description: The configuration for the monitor.
                    properties:
                      checkin_margin:
                        description: How long (in minutes) after the expected checkin time will we wait until we consider the checkin to have been missed.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      failure_issue_threshold:
                        description: How many consecutive missed or failed check-ins in a row before creating a new issue.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      max_runtime:
                        description: How long (in minutes) is the checkin allowed to run for in CheckInStatus.IN_PROGRESS before it is considered failed.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      recovery_threshold:
                        description: How many successful check-ins in a row before resolving an issue.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      schedule:
                        description: Varies depending on the schedule_type. Is either a crontab string, or a 2 element tuple for intervals (e.g. [1, 'day'])
                        x-kubernetes-preserve-unknown-fields: true
                      schedule_type:
                        description: |-
                          Currently supports "crontab" or "interval"

                          * `crontab`
                          * `interval`
                        enum:
                        - crontab
                        - interval
                        nullable: true
                        type: string
                      timezone:
                        description: |-
                          tz database style timezone string

                          * `Africa/Abidjan`
                          * `Africa/Accra`
                          * `Africa/Addis_Ababa`
                          * `Africa/Algiers`
                          * `Africa/Asmara`
