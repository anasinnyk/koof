---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "name": "provider"
  },
  "rules": [
    {
      "apiGroups": [
        "sentry.kube.nas1k.dev"
      ],
      "resources": [
        "dashboards",
        "monitors",
        "organizations",
        "clusterorganizations",
        "organizationmembers",
        "projects",
        "projectkeys",
        "servicehooks",
        "teams"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "patch",
        "update"
      ]
    },
    {
      "apiGroups": [
        "sentry.kube.nas1k.dev"
      ],
      "resources": [
        "dashboards/status",
        "monitors/status",
        "organizations/status",
        "clusterorganizations/status",
        "organizationmembers/status",
        "projects/status",
        "projectkeys/status",
        "servicehooks/status",
        "teams/status"
      ],
      "verbs": [
        "get",
        "patch",
        "update"
      ]
    },
    {
      "apiGroups": [
        "sentry.kube.nas1k.dev"
      ],
      "resources": [
        "dashboards/finalizers",
        "monitors/finalizers",
        "organizations/finalizers",
        "clusterorganizations/finalizers",
        "organizationmembers/finalizers",
        "projects/finalizers",
        "projectkeys/finalizers",
        "servicehooks/finalizers",
        "teams/finalizers"
      ],
      "verbs": [
        "update"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "secrets"
      ],
      "verbs": [
        "get"
      ]
    },
    {
      "apiGroups": [
        "events.k8s.io"
      ],
      "resources": [
        "events"
      ],
      "verbs": [
        "create",
        "patch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "provider"
  },
  "rules": [
    {
      "apiGroups": [
        "coordination.k8s.io"
      ],
      "resourceNames": [
        "koof-sentry"
      ],
      "resources": [
        "leases"
      ],
      "verbs": [
        "get",
        "update"
      ]
    },
    {
      "apiGroups": [
        "coordination.k8s.io"
      ],
      "resources": [
        "leases"
      ],
      "verbs": [
        "create"
      ]
    }
  ]
}
