name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      providers: ${{ steps.providers.outputs.list }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "koof") | .version')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: providers
        run: echo "list=$(ls crates/providers | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  crates:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo publish --locked -p koof -p koof-gen
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  images:
    needs: prepare
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      latest: true

  github-release:
    needs: [prepare, crates, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROVIDERS: ${{ needs.prepare.outputs.providers }}
      OWNER: ${{ needs.prepare.outputs.owner }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          for provider in $(jq -r '.[]' <<< "$PROVIDERS"); do
            sed -i "s|newName: .*|newName: ghcr.io/$OWNER/koof-$provider|" \
              "deploy/providers/$provider/kustomization.yaml"
            kubectl kustomize "deploy/providers/$provider" > "koof-$provider.yaml"
          done
      - run: gh release create "$TAG" --generate-notes koof-*.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
