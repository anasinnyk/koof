name: Images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.providers.outputs.list }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: providers
        run: echo "list=$(ls crates/providers | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.prepare.outputs.providers) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/koof-${{ matrix.provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: PROVIDER=${{ matrix.provider }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.provider }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.provider }}-${{ matrix.platform.arch }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.provider }}-${{ matrix.platform.arch }}
          path: digests/*
          retention-days: 1

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: ${{ fromJSON(needs.prepare.outputs.providers) }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/koof-${{ matrix.provider }}
      VERSION: ${{ inputs.version }}
      LATEST: ${{ inputs.latest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-${{ matrix.provider }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: digests
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          echo "\`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
