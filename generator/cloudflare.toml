[provider]
name = "cloudflare"
group = "cloudflare.cfrs.dev"
version = "v1alpha1"
api_base_url = "https://api.cloudflare.com/client/v4"
finalizer_prefix = "cloudflare.cfrs.dev"
external_id_annotation = "cloudflare.cfrs.dev/external-id"
field_manager = "cloudflare-provider"

[paths]
openapi = "openapi/cloudflare.yaml"
overlay = "openapi/cloudflare.overlay.yaml"
openapi_target_dir = "target/openapi"
sdk_generated_dir = "providers/cloudflare/src/cloudflare/generated"
controllers_generated_dir = "providers/cloudflare/src/controllers/generated"

[resources.Zone]
controller = "zone"
finalizer = "zone"
sdk_module = "zone"

[resources.DnsRecord]
controller = "owned_zone_json"
finalizer = "dns-record"
sdk_module = "dns_record"
status_type = "DnsRecordStatus"
variable = "dns_record"
zone_ref_expr = "dns_record.spec.zone_ref.name"
read_method = "dns_records_read"
create_method = "dns_records_create"
update_method = "dns_records_update"
delete_method = "dns_records_delete"
read_extra_args = ", None"
delete_extra_args = ", &Map::new()"
body = """
json!({
    "type": dns_record.spec.record_type,
    "name": dns_record.spec.name,
    "content": dns_record.spec.content,
    "ttl": dns_record.spec.ttl,
    "proxied": dns_record.spec.proxied,
    "comment": dns_record.spec.comment,
})
"""

[resources.ZoneRuleset]
controller = "owned_zone_json"
finalizer = "zone-ruleset"
sdk_module = "zone_ruleset"
status_type = "ZoneRulesetStatus"
variable = "zone_ruleset"
zone_ref_expr = "zone_ruleset.spec.zone_ref.name"
read_method = "zone_rulesets_read"
create_method = "zone_rulesets_create"
update_method = "zone_rulesets_update"
delete_method = "zone_rulesets_delete"
read_extra_args = ""
delete_extra_args = ", None"
body = """
json!({
    "name": zone_ruleset.spec.name,
    "kind": zone_ruleset.spec.kind,
    "phase": zone_ruleset.spec.phase,
    "description": zone_ruleset.spec.description,
    "rules": zone_ruleset.spec.rules,
})
"""

[resources.PagesProject]
controller = "pages_project"
finalizer = "pages-project"
sdk_module = "pages_project"
