# A fully managed record: created, kept in sync with the spec (changes made in the
# dashboard are reverted on the next resync) and deleted with the resource.
apiVersion: zones.cloudflare.kube.nas1k.dev/v1alpha1
kind: DNSRecord
metadata:
  name: rbs-nas1k-dev
  namespace: default
spec:
  forProvider:
    zoneRef:
      name: nas1k-dev
    type: TXT
    name: _demo.nas1k.dev
    content: "Rust BootCamp Summer 2026"
    ttl: 1
    proxied: false
    comment: managed by koof
