# A Pages project for direct uploads (no Git source). The deployment configs are
# required by the API schema; these are the API's defaults.
apiVersion: cloudflare.kube.nas1k.dev/v1alpha1
kind: PagesProject
metadata:
  name: example-pages
  namespace: default
spec:
  forProvider:
    accountRef:
      name: nas1k
    name: example-pages
    production_branch: main
    deployment_configs:
      preview: &config
        always_use_latest_compatibility_date: false
        build_image_major_version: 3
        compatibility_date: "2025-01-01"
        compatibility_flags: []
        env_vars: {}
        fail_open: true
        usage_model: standard
      production: *config
