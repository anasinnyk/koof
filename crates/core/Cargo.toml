[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
enumset = "1.1.14"
futures = "0.3.34"
heck = "0.5.0"
jiff = "0.2.37"
k8s-openapi = { version = "0.28.0", features = ["schemars", "v1_36"] }
kube = { version = "4.2.0", features = ["derive"] }
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
reqwest = { version = "0.13.5", features = ["json"] }
roas-overlay = "0.3.0"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
syn = "3.0.6"
thiserror = "2.0.20"
tracing = "0.1.44"
