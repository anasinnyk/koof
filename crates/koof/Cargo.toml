[package]
name = "koof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime for Kubernetes operators generated by koof-gen"
readme = "README.md"
keywords = ["kubernetes", "operator", "openapi", "controller", "crd"]
categories = ["api-bindings", "asynchronous", "development-tools"]

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
config = { version = "0.15", default-features = false }
futures = "0.3.34"
humantime-serde = "1.1"
jiff = "0.2.37"
k8s-openapi = { version = "0.28.0", features = ["schemars", "v1_36"] }
kube = { version = "4.2.0", features = ["client", "derive", "runtime", "rustls-tls", "unstable-runtime"] }
prometheus-client = "0.25.1"
reqwest = { version = "0.13.5", features = ["json"] }
regress = "0.10"
rustls = "0.23.45"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
smart-default = "0.7"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
