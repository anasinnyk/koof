[package]
name = "koof"
version = "0.1.0"
edition = "2024"
description = "Runtime for Kubernetes operators generated by koof-gen"

[lints]
workspace = true

[dependencies]
k8s-openapi = { version = "0.28.0", features = ["schemars", "v1_36"] }
kube = { version = "4.2.0", features = ["client", "derive", "runtime", "rustls-tls"] }
reqwest = { version = "0.13.5", features = ["json"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
