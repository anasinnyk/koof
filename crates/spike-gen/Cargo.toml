[package]
name = "spike-gen"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike (phase 2): workspace lints are intentionally not applied.

[dependencies]
anyhow = "1"
enumset = "1.1.14"
prettyplease = "0.3.0"
openapiv3 = "2.2.0"
roas = { version = "0.21.0", default-features = false, features = ["v3_0", "v3_1"] }
roas-overlay = "0.3.0"
schemars08 = { package = "schemars", version = "0.8.22" }
serde_json = "1"
serde_path_to_error = "0.1"
