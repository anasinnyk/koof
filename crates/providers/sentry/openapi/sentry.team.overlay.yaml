overlay: 1.1.0
info:
  title: Sentry Team
  version: 0.0.1
extends: ./sentry.json
actions:
  # The create request body is the resource schema.
  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/teams/'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: team
        apiVersion: sentry.kube.nas1k.dev/v1alpha1
        kind: Team

        test:
          forProvider:
            name: koof e2e
            slug: koof-e2e
          update:
            name: koof e2e renamed

        identifiers:
          external_id:
            type: external_name
          slug:
            type: field
            path: status.atProvider.slug

        references:
          organization:
            from: spec.forProvider.organizationRef
            target: organization

        credentials:
          securityScheme: auth_token
          source:
            type: related
            via: [organization]

        fields:
          mode: all

  # The team as the API returns it also carries the organization, its projects and
  # fields that depend on the token's user; status keeps the team itself.
  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].get.responses['200'].content['application/json'].schema.properties
    remove: true

  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].get.responses['200'].content['application/json'].schema.required
    remove: true

  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].get.responses['200'].content['application/json'].schema
    update:
      required: [id, slug, name]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        dateCreated:
          type: string
          format: date-time
          nullable: true
        memberCount:
          type: integer
        flags:
          type: object
          additionalProperties: {}

  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].put.responses['200'].content['application/json'].schema.properties
    remove: true

  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].put.responses['200'].content['application/json'].schema.required
    remove: true

  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].put.responses['200'].content['application/json'].schema
    update:
      required: [id, slug, name]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        dateCreated:
          type: string
          format: date-time
          nullable: true
        memberCount:
          type: integer
        flags:
          type: object
          additionalProperties: {}

  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].get
    update:
      x-kube-operation:
        resource: team
        lifecycle: observe
        pathParameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          team_id_or_slug:
            type: external_name

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/teams/'].post
    update:
      x-kube-operation:
        resource: team
        lifecycle: create
        pathParameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
        result:
          identifiers:
            external_id: response.body.id

  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].put
    update:
      x-kube-operation:
        resource: team
        lifecycle: update
        pathParameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          team_id_or_slug:
            type: external_name

  - target: $.paths['/api/0/teams/{organization_id_or_slug}/{team_id_or_slug}/'].delete
    update:
      x-kube-operation:
        resource: team
        lifecycle: delete
        pathParameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          team_id_or_slug:
            type: external_name
