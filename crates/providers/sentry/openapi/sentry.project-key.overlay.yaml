overlay: 1.1.0
info:
  title: Sentry ProjectKey
  version: 0.0.1
extends: ./sentry.json
actions:
  # The create request body is the resource schema.
  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/keys/'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: project_key
        apiVersion: sentry.kube.nas1k.dev/v1alpha1
        kind: ProjectKey
        scope: Namespaced

        identifiers:
          external_id:
            type: external_name

        references:
          project:
            from: spec.forProvider.projectRef
            target: project
            namespace: same_as_resource

        credentials:
          security_scheme: auth_token
          source:
            type: related
            via: [project, organization]

        fields:
          mode: all

  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/keys/{key_id}/'].get
    update:
      x-kube-operation:
        resource: project_key
        lifecycle: observe
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [project, organization]
            name: external_id
          project_id_or_slug:
            type: related_identifier
            via: [project]
            name: external_id
          key_id:
            type: external_name

  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/keys/'].post
    update:
      x-kube-operation:
        resource: project_key
        lifecycle: create
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [project, organization]
            name: external_id
          project_id_or_slug:
            type: related_identifier
            via: [project]
            name: external_id
        result:
          identifiers:
            external_id: response.body.id

  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/keys/{key_id}/'].put
    update:
      x-kube-operation:
        resource: project_key
        lifecycle: update
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [project, organization]
            name: external_id
          project_id_or_slug:
            type: related_identifier
            via: [project]
            name: external_id
          key_id:
            type: external_name

  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/keys/{key_id}/'].delete
    update:
      x-kube-operation:
        resource: project_key
        lifecycle: delete
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [project, organization]
            name: external_id
          project_id_or_slug:
            type: related_identifier
            via: [project]
            name: external_id
          key_id:
            type: external_name
