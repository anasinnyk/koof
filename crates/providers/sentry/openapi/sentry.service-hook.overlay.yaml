overlay: 1.1.0
info:
  title: Sentry ServiceHook
  version: 0.0.1
extends: ./sentry.json
actions:
  # The create request body is the resource schema.
  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/hooks/'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: service_hook
        apiVersion: sentry.kube.nas1k.dev/v1alpha1
        kind: ServiceHook
        scope: Namespaced

        identifiers:
          external_id:
            type: external_name

        references:
          project:
            from: spec.forProvider.projectRef
            target: project
            namespace: same_as_resource

        credentials:
          security_scheme: auth_token
          source:
            type: related
            via: [project, organization]

        fields:
          mode: all

  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/hooks/{hook_id}/'].get
    update:
      x-kube-operation:
        resource: service_hook
        lifecycle: observe
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [project, organization]
            name: external_id
          project_id_or_slug:
            type: related_identifier
            via: [project]
            name: external_id
          hook_id:
            type: external_name

  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/hooks/'].post
    update:
      x-kube-operation:
        resource: service_hook
        lifecycle: create
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [project, organization]
            name: external_id
          project_id_or_slug:
            type: related_identifier
            via: [project]
            name: external_id
        result:
          identifiers:
            external_id: response.body.id

  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/hooks/{hook_id}/'].put
    update:
      x-kube-operation:
        resource: service_hook
        lifecycle: update
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [project, organization]
            name: external_id
          project_id_or_slug:
            type: related_identifier
            via: [project]
            name: external_id
          hook_id:
            type: external_name

  - target: $.paths['/api/0/projects/{organization_id_or_slug}/{project_id_or_slug}/hooks/{hook_id}/'].delete
    update:
      x-kube-operation:
        resource: service_hook
        lifecycle: delete
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [project, organization]
            name: external_id
          project_id_or_slug:
            type: related_identifier
            via: [project]
            name: external_id
          hook_id:
            type: external_name
