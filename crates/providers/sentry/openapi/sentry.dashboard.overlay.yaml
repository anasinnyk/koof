overlay: 1.1.0
info:
  title: Sentry Dashboard
  version: 0.0.1
extends: ./sentry.json
actions:
  # The create request body is the resource schema.
  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/dashboards/'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: dashboard
        apiVersion: sentry.kube.nas1k.dev/v1alpha1
        kind: Dashboard

        identifiers:
          external_id:
            type: external_name

        references:
          organization:
            from: spec.forProvider.organizationRef
            target: organization

        credentials:
          security_scheme: auth_token
          source:
            type: related
            via: [organization]

        fields:
          mode: all

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/dashboards/{dashboard_id}/'].get
    update:
      x-kube-operation:
        resource: dashboard
        lifecycle: observe
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          dashboard_id:
            type: external_name

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/dashboards/'].post
    update:
      x-kube-operation:
        resource: dashboard
        lifecycle: create
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
        result:
          identifiers:
            external_id: response.body.id

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/dashboards/{dashboard_id}/'].put
    update:
      x-kube-operation:
        resource: dashboard
        lifecycle: update
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          dashboard_id:
            type: external_name

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/dashboards/{dashboard_id}/'].delete
    update:
      x-kube-operation:
        resource: dashboard
        lifecycle: delete
        path_parameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          dashboard_id:
            type: external_name
