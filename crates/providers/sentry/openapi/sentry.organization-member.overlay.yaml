overlay: 1.1.0
info:
  title: Sentry OrganizationMember
  version: 0.0.1
extends: ./sentry.json
actions:
  # The create request body is the resource schema.
  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: organization_member
        apiVersion: sentry.kube.nas1k.dev/v1alpha1
        kind: OrganizationMember

        test:
          forProvider:
            email: koof-e2e@example.com
            orgRole: member
            teamRoles:
              - teamSlug: koof-e2e
          update:
            teamRoles:
              - teamSlug: koof-e2e
                role: admin
              - teamSlug: koof-e2e-second

        identifiers:
          external_id:
            type: external_name

        references:
          organization:
            from: spec.forProvider.organizationRef
            target: organization

        itemReferences:
          team:
            from: spec.forProvider.teamRoles[].teamRef
            target: team
            into: teamSlug
            identifier: slug

        credentials:
          securityScheme: auth_token
          source:
            type: related
            via: [organization]

        fields:
          mode: all

        validations:
          - rule: "!has(self.orgRole) || self.orgRole != 'billing' || !has(self.teamRoles) || size(self.teamRoles) == 0"
            message: "a member with the billing role cannot be on teams"

  # Sentry replaces every team of the member with teamRoles on each update and
  # returns them in its own order, so the list is matched by teamSlug.
  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/'].post.requestBody.content['application/json'].schema.properties.teamRoles.items
    remove: true

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/'].post.requestBody.content['application/json'].schema.properties.teamRoles
    update:
      items:
        type: object
        description: A team the member is on.
        required: [teamSlug]
        properties:
          teamSlug:
            type: string
            description: Slug of the team.
          role:
            type: string
            enum: [contributor, admin]
            description: Team role; unset keeps the role Sentry assigns.
      x-kube-field:
        listMapKeys: [teamSlug]

  # role is null when Sentry assigns the team role itself; it may also be left out.
  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/{member_id}/'].get.responses['200'].content['application/json'].schema.properties.teamRoles.items.required
    remove: true

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/{member_id}/'].get.responses['200'].content['application/json'].schema.properties.teamRoles.items
    update:
      required: [teamSlug]

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/{member_id}/'].put.responses['200'].content['application/json'].schema.properties.teamRoles.items.required
    remove: true

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/{member_id}/'].put.responses['200'].content['application/json'].schema.properties.teamRoles.items
    update:
      required: [teamSlug]

  # Deprecated spellings of orgRole and teamRoles; managing both would drift.
  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/'].post.requestBody.content['application/json'].schema.properties.role
    update:
      x-kube-field:
        ignored: true

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/'].post.requestBody.content['application/json'].schema.properties.teams
    update:
      x-kube-field:
        ignored: true

  # Resending an invite: Sentry rejects an update that combines it with other fields.
  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/'].post.requestBody.content['application/json'].schema.properties.reinvite
    update:
      x-kube-field:
        ignored: true

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/'].post.requestBody.content['application/json'].schema.properties.regenerate
    update:
      x-kube-field:
        ignored: true

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/{member_id}/'].get
    update:
      x-kube-operation:
        resource: organization_member
        lifecycle: observe
        pathParameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          member_id:
            type: external_name

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/'].post
    update:
      x-kube-operation:
        resource: organization_member
        lifecycle: create
        pathParameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
        result:
          identifiers:
            external_id: response.body.id

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/{member_id}/'].put
    update:
      x-kube-operation:
        resource: organization_member
        lifecycle: update
        pathParameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          member_id:
            type: external_name

  - target: $.paths['/api/0/organizations/{organization_id_or_slug}/members/{member_id}/'].delete
    update:
      x-kube-operation:
        resource: organization_member
        lifecycle: delete
        pathParameters:
          organization_id_or_slug:
            type: related_identifier
            via: [organization]
            name: external_id
          member_id:
            type: external_name
