[package]
name = "cloudflare-provider"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
futures = "0.3.34"
jiff = "0.2.37"
k8s-openapi = { version = "0.28.0", features = ["schemars"] }
kube = { version = "4.2.0", features = ["derive", "client", "runtime", "rustls-tls"] }
koof = { path = "../../koof" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "signal", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
anyhow = "1.0.104"
serde_yaml = "0.9.34"
rustls = "0.23.45"
