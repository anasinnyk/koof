[package]
name = "cloudflare-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Generated doc comments come from API descriptions; code blocks in them are not
# Rust examples.
[lib]
doctest = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.34"
jiff = "0.2.37"
k8s-openapi = { version = "0.28.0", features = ["schemars"] }
kube = { version = "4.2.0", features = ["derive", "client", "runtime", "rustls-tls"] }
koof = { path = "../../koof", version = "0.1.0" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
regress = "0.10"
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1", features = ["serde"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "signal", "rt-multi-thread"] }
tracing = "0.1.44"
anyhow = "1.0.104"
serde_yaml = "0.9.34"
