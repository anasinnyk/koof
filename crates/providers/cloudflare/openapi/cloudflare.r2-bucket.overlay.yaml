overlay: 1.1.0
info:
  title: Cloudflare R2Bucket
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/accounts/{account_id}/r2/buckets'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: r2_bucket
        apiVersion: storage.cloudflare.kube.nas1k.dev/v1alpha1
        kind: R2Bucket
        scope: Namespaced

        test:
          forProvider:
            name: koof-e2e

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/r2/buckets/{bucket_name}'].get
    update:
      x-kube-operation:
        resource: r2_bucket
        lifecycle: observe
        response:
          path: result
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          bucket_name:
            type: external_name

  - target: $.paths['/accounts/{account_id}/r2/buckets'].post
    update:
      x-kube-operation:
        resource: r2_bucket
        lifecycle: create
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.name

  - target: $.paths['/accounts/{account_id}/r2/buckets/{bucket_name}'].delete
    update:
      x-kube-operation:
        resource: r2_bucket
        lifecycle: delete
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          bucket_name:
            type: external_name
