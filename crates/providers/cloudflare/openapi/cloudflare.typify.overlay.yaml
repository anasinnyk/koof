overlay: 1.1.0
info:
  title: Cloudflare schema fixes for typify
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # typify: numeric enums get a hand-written schemars 0.8 JsonSchema impl, and
  # `default: 1` is rejected against `anyOf: [{30..86400}, {enum: [1]}]`.
  # Keep the field and its default; express the range without anyOf.
  - target: $.components.schemas['dns-records_ttl'].anyOf
    remove: true
  - target: $.components.schemas['dns-records_ttl']
    update:
      type: integer
      minimum: 1
      maximum: 86400

  # Declared as `number`, but the API only takes whole seconds / priorities;
  # `number` becomes f64 and round-trips as `3600.0`.
  - target: $.components.schemas['dns-records_priority']
    update:
      type: integer

  # typify: numeric enum -> schemars 0.8 JsonSchema impl.
  - target: $.components.schemas.rulesets_RedirectFromValue.properties.status_code.enum
    remove: true
  - target: $.components.schemas.rulesets_RedirectFromValue.properties.status_code
    update:
      description: The status code to use for the redirect (301, 302, 303, 307 or 308).
      minimum: 301
      maximum: 308

  # typify: `enum: [[]]` on an array (errors must be empty on success) also gets a
  # hand-written schemars 0.8 impl. It only documents the success envelope.
  - target: $.components.responses.rulesets_Ruleset.content['application/json'].schema.allOf[1].properties.errors.enum
    remove: true
  - target: $.components.responses.rulesets_RulesetOrDryRun.content['application/json'].schema.allOf[1].properties.errors.enum
    remove: true

  # Spec bugs: string defaults on array fields; typify rejects them. A primitive
  # cannot be removed directly, so the property is replaced without its default.
  - target: $.components.schemas.healthchecks_http_config.properties.expected_codes
    remove: true
  - target: $.components.schemas.healthchecks_http_config.properties
    update:
      expected_codes:
        description: The expected HTTP response codes (e.g. "200") or code ranges (e.g. "2xx" for all codes starting with 2) of the health check.
        type: array
        items:
          type: string
        nullable: true
  - target: $.components.schemas['load-balancing_session_affinity_attributes'].properties.headers
    remove: true
  - target: $.components.schemas['load-balancing_session_affinity_attributes'].properties
    update:
      headers:
        description: Names of HTTP headers to base session affinity on when header `session_affinity` is enabled.
        type: array
        items:
          description: An HTTP header name.
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
        uniqueItems: true
