overlay: 1.1.0
info:
  title: Cloudflare GatewayRule
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/accounts/{account_id}/gateway/rules'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: gateway_rule
        apiVersion: zerotrust.cloudflare.kube.nas1k.dev/v1alpha1
        kind: GatewayRule

        test:
          forProvider:
            name: koof e2e
            action: block
            filters: [dns]
            traffic: any(dns.domains[*] == "example.com")
            enabled: true
          update:
            enabled: false

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/gateway/rules/{rule_id}'].get
    update:
      x-kube-operation:
        resource: gateway_rule
        lifecycle: observe
        response:
          path: result
          deleted_when: deleted_at
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          rule_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/gateway/rules'].post
    update:
      x-kube-operation:
        resource: gateway_rule
        lifecycle: create
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/gateway/rules/{rule_id}'].put
    update:
      x-kube-operation:
        resource: gateway_rule
        lifecycle: update
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          rule_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/gateway/rules/{rule_id}'].delete
    update:
      x-kube-operation:
        resource: gateway_rule
        lifecycle: delete
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          rule_id:
            type: external_name
