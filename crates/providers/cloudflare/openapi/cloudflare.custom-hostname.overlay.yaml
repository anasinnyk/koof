overlay: 1.1.0
info:
  title: Cloudflare CustomHostname
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/zones/{zone_id}/custom_hostnames'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: custom_hostname
        apiVersion: zones.cloudflare.kube.nas1k.dev/v1alpha1
        kind: CustomHostname
        scope: Namespaced

        identifiers:
          external_id:
            type: external_name

        references:
          zone:
            from: spec.forProvider.zoneRef
            target: zone
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [zone, account]

        fields:
          mode: all

  - target: $.paths['/zones/{zone_id}/custom_hostnames/{custom_hostname_id}'].get
    update:
      x-kube-operation:
        resource: custom_hostname
        lifecycle: observe
        response:
          path: result
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          custom_hostname_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/custom_hostnames'].post
    update:
      x-kube-operation:
        resource: custom_hostname
        lifecycle: create
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}/custom_hostnames/{custom_hostname_id}'].patch
    update:
      x-kube-operation:
        resource: custom_hostname
        lifecycle: update
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          custom_hostname_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/custom_hostnames/{custom_hostname_id}'].delete
    update:
      x-kube-operation:
        resource: custom_hostname
        lifecycle: delete
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          custom_hostname_id:
            type: external_name
