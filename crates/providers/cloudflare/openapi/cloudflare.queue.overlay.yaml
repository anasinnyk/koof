overlay: 1.1.0
info:
  title: Cloudflare Queue
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/accounts/{account_id}/queues'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: queue
        apiVersion: storage.cloudflare.kube.nas1k.dev/v1alpha1
        kind: Queue
        scope: Namespaced

        test:
          forProvider:
            queue_name: koof-e2e
          update:
            queue_name: koof-e2e-renamed

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/queues/{queue_id}'].get
    update:
      x-kube-operation:
        resource: queue
        lifecycle: observe
        response:
          path: result
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          queue_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/queues'].post
    update:
      x-kube-operation:
        resource: queue
        lifecycle: create
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.queue_id

  - target: $.paths['/accounts/{account_id}/queues/{queue_id}'].put
    update:
      x-kube-operation:
        resource: queue
        lifecycle: update
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          queue_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/queues/{queue_id}'].delete
    update:
      x-kube-operation:
        resource: queue
        lifecycle: delete
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          queue_id:
            type: external_name
