overlay: 1.1.0
info:
  title: Cloudflare SpectrumApplication
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['spectrum-config_update_app_config']
    update:
      x-kube-resource:
        name: spectrum_application
        apiVersion: zones.cloudflare.kube.nas1k.dev/v1alpha1
        kind: SpectrumApplication

        test:
          forProvider:
            protocol: tcp/22
            dns:
              type: CNAME
              name: ssh.example.com
            origin_direct: [tcp://192.0.2.1:22]
            traffic_type: direct
          update:
            ip_firewall: true

        identifiers:
          external_id:
            type: external_name

        references:
          zone:
            from: spec.forProvider.zoneRef
            target: zone

        credentials:
          securityScheme: api_token
          source:
            type: related
            via: [zone, account]

        fields:
          mode: all

  - target: $.paths['/zones/{zone_id}/spectrum/apps/{app_id}'].get
    update:
      x-kube-operation:
        resource: spectrum_application
        lifecycle: observe
        response:
          path: result
        pathParameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          app_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/spectrum/apps'].post
    update:
      x-kube-operation:
        resource: spectrum_application
        lifecycle: create
        pathParameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}/spectrum/apps/{app_id}'].put
    update:
      x-kube-operation:
        resource: spectrum_application
        lifecycle: update
        pathParameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          app_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/spectrum/apps/{app_id}'].delete
    update:
      x-kube-operation:
        resource: spectrum_application
        lifecycle: delete
        pathParameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          app_id:
            type: external_name
