overlay: 1.1.0
info:
  title: Cloudflare Pages Project
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  - target: $.components.schemas.pages_project
    update:
      x-kube-resource:
        name: pages_project
        apiVersion: cloudflare.kube.nas1k.dev/v1alpha1
        kind: PagesProject

        test:
          forProvider:
            name: koof-e2e
            production_branch: main
            deployment_configs:
              preview: &config
                always_use_latest_compatibility_date: false
                build_image_major_version: 3
                compatibility_date: "2025-01-01"
                compatibility_flags: []
                env_vars: {}
                fail_open: true
                usage_model: standard
              production: *config
          update:
            production_branch: release

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account

        credentials:
          securityScheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: explicit
          forProvider:
            - name
            - production_branch
            - build_config
            - deployment_configs
            - source
          atProvider:
            - id
            - name
            - created_on
            - domains
            - framework
            - framework_version
            - preview_script_name
            - production_script_name
            - production_branch
            - subdomain
            - uses_functions

  - target: $.paths['/accounts/{account_id}/pages/projects/{project_name}'].get
    update:
      x-kube-operation:
        resource: pages_project
        lifecycle: observe
        response:
          path: result
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          project_name:
            type: coalesce
            values:
              - type: external_name
              - type: field
                path: spec.resourceName
              - type: field
                path: metadata.name
        result:
          identifiers:
            external_id: response.body.result.name

  - target: $.paths['/accounts/{account_id}/pages/projects'].post
    update:
      x-kube-operation:
        resource: pages_project
        lifecycle: create
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.name

  - target: $.paths['/accounts/{account_id}/pages/projects/{project_name}'].patch
    update:
      x-kube-operation:
        resource: pages_project
        lifecycle: update
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          project_name:
            type: coalesce
            values:
              - type: external_name
              - type: field
                path: spec.resourceName
              - type: field
                path: metadata.name
        result:
          identifiers:
            external_id: response.body.result.name

  - target: $.paths['/accounts/{account_id}/pages/projects/{project_name}'].delete
    update:
      x-kube-operation:
        resource: pages_project
        lifecycle: delete
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          project_name:
            type: coalesce
            values:
              - type: external_name
              - type: field
                path: spec.resourceName
              - type: field
                path: metadata.name
        result:
          identifiers:
            external_id: response.body.result.name

  # Environment variables take their value from a Secret with
  # valueFrom.secretKeyRef; Cloudflare returns secret_text values empty.
  - target: $.components.schemas.pages_plain_text_env_var.properties.value
    update:
      x-kube-field:
        secretKeyRef: true

  - target: $.components.schemas.pages_secret_text_env_var.properties.value
    update:
      x-kube-field:
        secretKeyRef: true

  # The API leaves compatibility_date and compatibility_flags out for some
  # projects; they only matter for Pages Functions.
  - target: $.components.schemas.pages_deployment_config_values.required
    remove: true
  - target: $.components.schemas.pages_deployment_config_values
    update:
      required:
        - env_vars
        - fail_open
        - always_use_latest_compatibility_date
        - build_image_major_version
        - usage_model

  # Projects without Smart Placement return `placement: {}`.
  - target: $.components.schemas.pages_deployment_config_values.properties.placement.required
    remove: true

  # Projects deployed with `wrangler pages deploy` (wrangler_config_hash is set)
  # get their deployment configs from wrangler.toml; leaving deployment_configs
  # out keeps koof from sending or comparing them.
  - target: $.components.schemas.pages_project.required
    remove: true
  - target: $.components.schemas.pages_project
    update:
      required:
        - id
        - name
        - latest_deployment
        - canonical_deployment
        - created_on
        - production_branch
        - production_script_name
        - preview_script_name
        - uses_functions
        - framework
        - framework_version
  - target: $.components.schemas.pages_project.properties.deployment_configs
    update:
      description: >-
        Configs for deployments in a project. Leave it out for a project whose
        deployment configs `wrangler pages deploy` writes from wrangler.toml (its
        `wrangler_config_hash` is set): koof then neither sends nor compares them.
