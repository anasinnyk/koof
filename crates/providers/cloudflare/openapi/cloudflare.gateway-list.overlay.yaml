overlay: 1.1.0
info:
  title: Cloudflare GatewayList
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/accounts/{account_id}/gateway/lists'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: gateway_list
        apiVersion: zerotrust.cloudflare.kube.nas1k.dev/v1alpha1
        kind: GatewayList

        test:
          forProvider:
            name: koof e2e
            type: DOMAIN
            items:
              - value: example.com
          update:
            description: updated by koof e2e

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account

        credentials:
          securityScheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/gateway/lists/{list_id}'].get
    update:
      x-kube-operation:
        resource: gateway_list
        lifecycle: observe
        response:
          path: result
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          list_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/gateway/lists'].post
    update:
      x-kube-operation:
        resource: gateway_list
        lifecycle: create
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/gateway/lists/{list_id}'].put
    update:
      x-kube-operation:
        resource: gateway_list
        lifecycle: update
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          list_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/gateway/lists/{list_id}'].delete
    update:
      x-kube-operation:
        resource: gateway_list
        lifecycle: delete
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          list_id:
            type: external_name
