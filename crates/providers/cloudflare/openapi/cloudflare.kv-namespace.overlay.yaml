overlay: 1.1.0
info:
  title: Cloudflare KVNamespace
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['workers-kv_create_namespace_body']
    update:
      x-kube-resource:
        name: kv_namespace
        apiVersion: storage.cloudflare.kube.nas1k.dev/v1alpha1
        kind: KVNamespace
        scope: Namespaced

        test:
          forProvider:
            title: koof-e2e
          update:
            title: koof-e2e-renamed

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/storage/kv/namespaces/{namespace_id}'].get
    update:
      x-kube-operation:
        resource: kv_namespace
        lifecycle: observe
        response:
          path: result
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          namespace_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/storage/kv/namespaces'].post
    update:
      x-kube-operation:
        resource: kv_namespace
        lifecycle: create
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/storage/kv/namespaces/{namespace_id}'].put
    update:
      x-kube-operation:
        resource: kv_namespace
        lifecycle: update
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          namespace_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/storage/kv/namespaces/{namespace_id}'].delete
    update:
      x-kube-operation:
        resource: kv_namespace
        lifecycle: delete
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          namespace_id:
            type: external_name
