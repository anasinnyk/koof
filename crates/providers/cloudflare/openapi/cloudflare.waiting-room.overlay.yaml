overlay: 1.1.0
info:
  title: Cloudflare WaitingRoom
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['waitingroom_query_waitingroom']
    update:
      x-kube-resource:
        name: waiting_room
        apiVersion: zones.cloudflare.kube.nas1k.dev/v1alpha1
        kind: WaitingRoom
        scope: Namespaced

        test:
          forProvider:
            name: koof_e2e
            host: shop.example.com
            new_users_per_minute: 200
            total_active_users: 300
          update:
            total_active_users: 400

        identifiers:
          external_id:
            type: external_name

        references:
          zone:
            from: spec.forProvider.zoneRef
            target: zone
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [zone, account]

        fields:
          mode: all

  - target: $.paths['/zones/{zone_id}/waiting_rooms/{waiting_room_id}'].get
    update:
      x-kube-operation:
        resource: waiting_room
        lifecycle: observe
        response:
          path: result
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          waiting_room_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/waiting_rooms'].post
    update:
      x-kube-operation:
        resource: waiting_room
        lifecycle: create
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}/waiting_rooms/{waiting_room_id}'].put
    update:
      x-kube-operation:
        resource: waiting_room
        lifecycle: update
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          waiting_room_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/waiting_rooms/{waiting_room_id}'].delete
    update:
      x-kube-operation:
        resource: waiting_room
        lifecycle: delete
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          waiting_room_id:
            type: external_name
