overlay: 1.1.0
info:
  title: Cloudflare TurnstileWidget
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/accounts/{account_id}/challenges/widgets'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: turnstile_widget
        apiVersion: cloudflare.kube.nas1k.dev/v1alpha1
        kind: TurnstileWidget

        test:
          forProvider:
            name: koof e2e
            domains: [example.com]
            mode: managed
          update:
            mode: invisible

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account

        credentials:
          securityScheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/challenges/widgets/{sitekey}'].get
    update:
      x-kube-operation:
        resource: turnstile_widget
        lifecycle: observe
        response:
          path: result
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          sitekey:
            type: external_name

  - target: $.paths['/accounts/{account_id}/challenges/widgets'].post
    update:
      x-kube-operation:
        resource: turnstile_widget
        lifecycle: create
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.sitekey

  - target: $.paths['/accounts/{account_id}/challenges/widgets/{sitekey}'].put
    update:
      x-kube-operation:
        resource: turnstile_widget
        lifecycle: update
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          sitekey:
            type: external_name

  - target: $.paths['/accounts/{account_id}/challenges/widgets/{sitekey}'].delete
    update:
      x-kube-operation:
        resource: turnstile_widget
        lifecycle: delete
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          sitekey:
            type: external_name
