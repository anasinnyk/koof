overlay: 1.1.0
info:
  title: Cloudflare VectorizeIndex
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['vectorize_create-index-request']
    update:
      x-kube-resource:
        name: vectorize_index
        apiVersion: storage.cloudflare.kube.nas1k.dev/v1alpha1
        kind: VectorizeIndex
        scope: Namespaced

        test:
          forProvider:
            name: koof-e2e
            config:
              dimensions: 768
              metric: cosine

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/vectorize/v2/indexes/{index_name}'].get
    update:
      x-kube-operation:
        resource: vectorize_index
        lifecycle: observe
        response:
          path: result
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          index_name:
            type: external_name

  - target: $.paths['/accounts/{account_id}/vectorize/v2/indexes'].post
    update:
      x-kube-operation:
        resource: vectorize_index
        lifecycle: create
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.name

  - target: $.paths['/accounts/{account_id}/vectorize/v2/indexes/{index_name}'].delete
    update:
      x-kube-operation:
        resource: vectorize_index
        lifecycle: delete
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          index_name:
            type: external_name
