overlay: 1.1.0
info:
  title: Cloudflare EmailRoutingRule
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['email_create_rule_properties']
    update:
      x-kube-resource:
        name: email_routing_rule
        apiVersion: zones.cloudflare.kube.nas1k.dev/v1alpha1
        kind: EmailRoutingRule

        test:
          forProvider:
            name: koof e2e
            enabled: true
            matchers:
              - type: literal
                field: to
                value: hello@example.com
            actions:
              - type: forward
                value: [team@example.com]
          update:
            enabled: false

        identifiers:
          external_id:
            type: external_name

        references:
          zone:
            from: spec.forProvider.zoneRef
            target: zone

        credentials:
          securityScheme: api_token
          source:
            type: related
            via: [zone, account]

        fields:
          mode: all

  - target: $.paths['/zones/{zone_id}/email/routing/rules/{rule_identifier}'].get
    update:
      x-kube-operation:
        resource: email_routing_rule
        lifecycle: observe
        response:
          path: result
        pathParameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          rule_identifier:
            type: external_name

  - target: $.paths['/zones/{zone_id}/email/routing/rules'].post
    update:
      x-kube-operation:
        resource: email_routing_rule
        lifecycle: create
        pathParameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}/email/routing/rules/{rule_identifier}'].put
    update:
      x-kube-operation:
        resource: email_routing_rule
        lifecycle: update
        pathParameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          rule_identifier:
            type: external_name

  - target: $.paths['/zones/{zone_id}/email/routing/rules/{rule_identifier}'].delete
    update:
      x-kube-operation:
        resource: email_routing_rule
        lifecycle: delete
        pathParameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          rule_identifier:
            type: external_name
