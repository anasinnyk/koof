overlay: 1.1.0
info:
  title: Cloudflare WorkerRoute
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['workers_route']
    update:
      x-kube-resource:
        name: worker_route
        apiVersion: workers.cloudflare.kube.nas1k.dev/v1alpha1
        kind: WorkerRoute

        test:
          forProvider:
            pattern: example.com/*
            script: app
          update:
            script: app-v2

        identifiers:
          external_id:
            type: external_name

        references:
          zone:
            from: spec.forProvider.zoneRef
            target: zone

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [zone, account]

        fields:
          mode: all

  - target: $.paths['/zones/{zone_id}/workers/routes/{route_id}'].get
    update:
      x-kube-operation:
        resource: worker_route
        lifecycle: observe
        response:
          path: result
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          route_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/workers/routes'].post
    update:
      x-kube-operation:
        resource: worker_route
        lifecycle: create
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}/workers/routes/{route_id}'].put
    update:
      x-kube-operation:
        resource: worker_route
        lifecycle: update
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          route_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/workers/routes/{route_id}'].delete
    update:
      x-kube-operation:
        resource: worker_route
        lifecycle: delete
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          route_id:
            type: external_name
