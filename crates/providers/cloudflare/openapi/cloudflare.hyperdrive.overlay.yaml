overlay: 1.1.0
info:
  title: Cloudflare Hyperdrive
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['hyperdrive_hyperdrive-config']
    update:
      x-kube-resource:
        name: hyperdrive
        apiVersion: storage.cloudflare.kube.nas1k.dev/v1alpha1
        kind: Hyperdrive
        scope: Namespaced

        test:
          forProvider:
            name: koof-e2e
            origin:
              scheme: postgres
              host: db.example.com
              port: 5432
              database: app
              user: koof
              password: koof
          update:
            origin_connection_limit: 60

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/hyperdrive/configs/{hyperdrive_id}'].get
    update:
      x-kube-operation:
        resource: hyperdrive
        lifecycle: observe
        response:
          path: result
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          hyperdrive_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/hyperdrive/configs'].post
    update:
      x-kube-operation:
        resource: hyperdrive
        lifecycle: create
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/hyperdrive/configs/{hyperdrive_id}'].put
    update:
      x-kube-operation:
        resource: hyperdrive
        lifecycle: update
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          hyperdrive_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/hyperdrive/configs/{hyperdrive_id}'].delete
    update:
      x-kube-operation:
        resource: hyperdrive
        lifecycle: delete
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          hyperdrive_id:
            type: external_name
