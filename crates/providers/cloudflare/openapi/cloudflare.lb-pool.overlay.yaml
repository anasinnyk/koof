overlay: 1.1.0
info:
  title: Cloudflare LoadBalancerPool
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/accounts/{account_id}/load_balancers/pools'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: lb_pool
        apiVersion: loadbalancing.cloudflare.kube.nas1k.dev/v1alpha1
        kind: LoadBalancerPool

        test:
          forProvider:
            name: koof-e2e
            origins:
              - name: origin
                address: 192.0.2.10
                enabled: true
          update:
            description: updated by koof e2e

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account

        credentials:
          securityScheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/load_balancers/pools/{pool_id}'].get
    update:
      x-kube-operation:
        resource: lb_pool
        lifecycle: observe
        response:
          path: result
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          pool_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/load_balancers/pools'].post
    update:
      x-kube-operation:
        resource: lb_pool
        lifecycle: create
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/load_balancers/pools/{pool_id}'].put
    update:
      x-kube-operation:
        resource: lb_pool
        lifecycle: update
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          pool_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/load_balancers/pools/{pool_id}'].delete
    update:
      x-kube-operation:
        resource: lb_pool
        lifecycle: delete
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          pool_id:
            type: external_name
