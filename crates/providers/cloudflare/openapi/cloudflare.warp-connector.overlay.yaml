overlay: 1.1.0
info:
  title: Cloudflare WARP Connector
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/accounts/{account_id}/warp_connector'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: warp_connector
        apiVersion: zerotrust.cloudflare.kube.nas1k.dev/v1alpha1
        kind: WarpConnector

        test:
          forProvider:
            name: koof-e2e
          update:
            name: koof-e2e-renamed

        # Cloudflare only takes `ha` on create.
        immutable: [ha]

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account

        credentials:
          securityScheme: api_token
          source:
            type: related
            via: [account]

        # The token the WARP Connector is installed with (`warp-cli connector new`);
        # Cloudflare returns it only from the token operation.
        connectionSecret:
          tunnel_id: id
          token:
            from: connectionDetails

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/warp_connector/{tunnel_id}'].get
    update:
      x-kube-operation:
        resource: warp_connector
        lifecycle: observe
        response:
          path: result
          deletedWhen: deleted_at
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          tunnel_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/warp_connector'].post
    update:
      x-kube-operation:
        resource: warp_connector
        lifecycle: create
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/warp_connector/{tunnel_id}'].patch
    update:
      x-kube-operation:
        resource: warp_connector
        lifecycle: update
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          tunnel_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/warp_connector/{tunnel_id}'].delete
    update:
      x-kube-operation:
        resource: warp_connector
        lifecycle: delete
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          tunnel_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/warp_connector/{tunnel_id}/token'].get
    update:
      x-kube-operation:
        resource: warp_connector
        lifecycle: observe
        connectionDetails: true
        response:
          path: result
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          tunnel_id:
            type: external_name
