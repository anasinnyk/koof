overlay: 1.1.0
info:
  title: Cloudflare Zone
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  - target: $.components.schemas.zones_zone
    update:
      x-kube-resource:
        name: zone
        apiVersion: cloudflare.kube.nas1k.dev/v1alpha1
        kind: Zone

        # A zone cannot be renamed; a new name is a new zone.
        immutable: [name]

        test:
          forProvider:
            name: example.com
            type: full
          update:
            paused: true

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: explicit
          forProvider:
            - name
            - type
            - paused
            - vanity_name_servers
          atProvider:
            - id
            - name
            - type
            - status
            - paused
            - activated_on
            - created_on
            - modified_on
            - development_mode
            - name_servers
            - original_name_servers
            - original_registrar
            - original_dnshost
            - verification_key
            - vanity_name_servers

  - target: $.paths['/zones/{zone_id}'].get
    update:
      x-kube-operation:
        resource: zone
        lifecycle: observe
        response:
          path: result
        path_parameters:
          zone_id:
            type: external_name
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones'].post
    update:
      x-kube-operation:
        resource: zone
        lifecycle: create
        request:
          from: spec.forProvider
          set:
            account.id:
              type: related_identifier
              via: [account]
              name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}'].patch
    update:
      x-kube-operation:
        resource: zone
        lifecycle: update
        path_parameters:
          zone_id:
            type: external_name
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}'].delete
    update:
      x-kube-operation:
        resource: zone
        lifecycle: delete
        path_parameters:
          zone_id:
            type: external_name
        result:
          identifiers:
            external_id: response.body.result.id
