overlay: 1.1.0
info:
  title: Cloudflare DNSRecord
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  - target: $.components.schemas['dns-records_dns-record-post']
    update:
      x-kube-resource:
        name: dns_record
        apiVersion: zones.cloudflare.kube.nas1k.dev/v1alpha1
        kind: DNSRecord
        scope: Namespaced

        validations:
          - rule: "!has(self.ttl) || self.ttl == 1 || (self.ttl >= 30 && self.ttl <= 86400)"
            message: "ttl must be 1 (automatic) or between 30 and 86400 seconds"

        test:
          forProvider:
            type: A
            name: www.example.com
            content: 192.0.2.1
            ttl: 1
            proxied: false
          update:
            content: 192.0.2.2
            comment: updated by koof e2e

        identifiers:
          external_id:
            type: external_name

        references:
          zone:
            from: spec.forProvider.zoneRef
            target: zone
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [zone, account]

        fields:
          mode: explicit
          forProvider:
            - type
            - name
            - content
            - data
            - ttl
            - priority
            - proxied
            - comment
            - tags
            - settings
          atProvider:
            - id
            - type
            - name
            - content
            - data
            - ttl
            - priority
            - proxied
            - proxiable
            - comment
            - tags
            - settings
            - created_on
            - modified_on

  - target: $.paths['/zones/{zone_id}/dns_records/{dns_record_id}'].get
    update:
      x-kube-operation:
        resource: dns_record
        lifecycle: observe
        response:
          path: result
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          dns_record_id:
            type: external_name

  - target: $.paths['/zones/{zone_id}/dns_records'].post
    update:
      x-kube-operation:
        resource: dns_record
        lifecycle: create
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}/dns_records/{dns_record_id}'].patch
    update:
      x-kube-operation:
        resource: dns_record
        lifecycle: update
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          dns_record_id:
            type: external_name
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/zones/{zone_id}/dns_records/{dns_record_id}'].delete
    update:
      x-kube-operation:
        resource: dns_record
        lifecycle: delete
        path_parameters:
          zone_id:
            type: related_identifier
            via: [zone]
            name: external_id
          dns_record_id:
            type: external_name
        result:
          identifiers:
            external_id: response.body.result.id
