overlay: 1.1.0
info:
  title: Cloudflare LoadBalancerMonitor
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.paths['/accounts/{account_id}/load_balancers/monitors'].post.requestBody.content['application/json'].schema
    update:
      x-kube-resource:
        name: lb_monitor
        apiVersion: loadbalancing.cloudflare.kube.nas1k.dev/v1alpha1
        kind: LoadBalancerMonitor
        scope: Namespaced

        test:
          forProvider:
            type: https
            path: /health
            expected_codes: "200"
            description: koof e2e
          update:
            interval: 120

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/load_balancers/monitors/{monitor_id}'].get
    update:
      x-kube-operation:
        resource: lb_monitor
        lifecycle: observe
        response:
          path: result
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          monitor_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/load_balancers/monitors'].post
    update:
      x-kube-operation:
        resource: lb_monitor
        lifecycle: create
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/load_balancers/monitors/{monitor_id}'].put
    update:
      x-kube-operation:
        resource: lb_monitor
        lifecycle: update
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          monitor_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/load_balancers/monitors/{monitor_id}'].delete
    update:
      x-kube-operation:
        resource: lb_monitor
        lifecycle: delete
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          monitor_id:
            type: external_name
