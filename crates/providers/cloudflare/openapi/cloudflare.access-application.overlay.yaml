overlay: 1.1.0
info:
  title: Cloudflare AccessApplication
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['access_app_request']
    update:
      x-kube-resource:
        name: access_application
        apiVersion: zerotrust.cloudflare.kube.nas1k.dev/v1alpha1
        kind: AccessApplication

        test:
          forProvider:
            type: self_hosted
            name: koof e2e
            domain: app.example.com
            self_hosted_domains: [app.example.com]
            session_duration: 24h
          update:
            session_duration: 12h

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account

        itemReferences:
          policy:
            from: spec.forProvider.policies[].policyRef
            target: access_policy
            into: id
            identifier: external_id

        credentials:
          securityScheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/access/apps/{app_id}'].get
    update:
      x-kube-operation:
        resource: access_application
        lifecycle: observe
        response:
          path: result
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          app_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/access/apps'].post
    update:
      x-kube-operation:
        resource: access_application
        lifecycle: create
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/access/apps/{app_id}'].put
    update:
      x-kube-operation:
        resource: access_application
        lifecycle: update
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          app_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/access/apps/{app_id}'].delete
    update:
      x-kube-operation:
        resource: access_application
        lifecycle: delete
        pathParameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          app_id:
            type: external_name

  # Infrastructure applications take only inline policies, which would leave
  # policies untyped; they are not managed by this kind.
  - target: $.components.schemas['access_app_request'].anyOf[?(@.title == 'Infrastructure application')]
    remove: true

  # Applications link reusable policies (AccessPolicy) by ID, in ascending order
  # of precedence; inline policies are not managed. Cloudflare returns the full
  # policies, so the list is matched by id.
  - target: $.components.schemas['access_app_req_embedded_policies'].properties.policies.items
    remove: true

  - target: $.components.schemas['access_app_req_embedded_policies'].properties.policies
    update:
      description: The reusable policies that Access applies to the application.
      items:
        type: object
        description: A reusable policy linked to the application.
        required: [id]
        properties:
          id:
            type: string
            description: ID of the reusable policy.
          precedence:
            type: integer
            description: Order of evaluation; lower values are evaluated first.
      x-kube-field:
        listMapKeys: [id]
