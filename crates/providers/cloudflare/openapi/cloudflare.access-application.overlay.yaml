overlay: 1.1.0
info:
  title: Cloudflare AccessApplication
  version: 0.0.1
extends: ./cloudflare.yaml
actions:
  # The create request body is the resource schema: forProvider gets its writable
  # fields, atProvider every field of the observe response.
  - target: $.components.schemas['access_app_request']
    update:
      x-kube-resource:
        name: access_application
        apiVersion: zerotrust.cloudflare.kube.nas1k.dev/v1alpha1
        kind: AccessApplication
        scope: Namespaced

        test:
          forProvider:
            type: self_hosted
            name: koof e2e
            domain: app.example.com
            self_hosted_domains: [app.example.com]
            session_duration: 24h
          update:
            session_duration: 12h

        identifiers:
          external_id:
            type: external_name

        references:
          account:
            from: spec.forProvider.accountRef
            target: account
            namespace: same_as_resource

        credentials:
          security_scheme: api_token
          source:
            type: related
            via: [account]

        fields:
          mode: all

  - target: $.paths['/accounts/{account_id}/access/apps/{app_id}'].get
    update:
      x-kube-operation:
        resource: access_application
        lifecycle: observe
        response:
          path: result
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          app_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/access/apps'].post
    update:
      x-kube-operation:
        resource: access_application
        lifecycle: create
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
        result:
          identifiers:
            external_id: response.body.result.id

  - target: $.paths['/accounts/{account_id}/access/apps/{app_id}'].put
    update:
      x-kube-operation:
        resource: access_application
        lifecycle: update
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          app_id:
            type: external_name

  - target: $.paths['/accounts/{account_id}/access/apps/{app_id}'].delete
    update:
      x-kube-operation:
        resource: access_application
        lifecycle: delete
        path_parameters:
          account_id:
            type: related_identifier
            via: [account]
            name: external_id
          app_id:
            type: external_name
