[package]
name = "spike-provider"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike (phase 2): compiles typify output against schemars 1.x + kube.

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
k8s-openapi = { version = "0.28.0", features = ["schemars", "v1_36"] }
kube = { version = "4.2.0", features = ["client", "derive", "runtime", "rustls-tls"] }
regress = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = "0.23"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
urlencoding = "2.1.3"
