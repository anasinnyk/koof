[package]
name = "koof-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Generates Kubernetes operator code from OpenAPI + overlays"
readme = "README.md"
keywords = ["kubernetes", "operator", "openapi", "codegen", "crd"]
categories = ["development-tools", "command-line-utilities"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
enumset = "1.1.14"
heck = "0.5.0"
humantime = "2"
jsonptr = "0.8"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
roas-overlay = "0.3.0"
schemars08 = { package = "schemars", version = "0.8.22" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
syn = "3.0.6"
thiserror = "2.0.20"
typify = { version = "0.8.0", default-features = false }

[dev-dependencies]
insta = "1.43"
pretty_assertions = "1"
rstest = "0.26"
